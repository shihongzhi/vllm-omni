# Audio8 TTS deploy: two-stage AR -> codec on a single GPU.
# Verified on 1x RTX (11 GB, fp32 stage-1 codec) for short clips.
#
# Registry key is the checkpoint's model_type "arktts" so
# `vllm-omni serve <model-dir>` auto-detects. Stage-0 streams accumulated
# code snapshots through the async_chunk producer hook; the clip is handed
# to the codec stage as one chunk on finish (chunked decode TODO).
async_chunk: true
enable_chunked_prefill: false

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300

stages:
  - stage_id: 0
    max_num_seqs: 4
    gpu_memory_utilization: 0.6
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: false
    # Audio8 max_seq_len is 2048; vLLM >=0.19 requires
    # max_num_batched_tokens >= max_model_len when chunked prefill is off.
    max_num_batched_tokens: 2048
    max_model_len: 2048
    devices: "0"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.8
      top_k: 50
      top_p: 0.95
      max_tokens: 1536
      seed: 42
      repetition_penalty: 1.0

  - stage_id: 1
    max_num_seqs: 1
    gpu_memory_utilization: 0.15
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: false
    max_num_batched_tokens: 2048
    max_model_len: 2048
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      seed: 42
      repetition_penalty: 1.0
